<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://api.ipify.org https://www.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; frame-src https://accounts.google.com https://*.firebaseapp.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats des votes - Jen et ses Saints</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-header: #f8f9fa;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #e8eaed;
            --accent-blue: #0056D2;
            --win-color: #34a853;
            --loss-color: #ea4335;
            --gold: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            max-width: 600px;
            margin: 0 auto;
        }

        .app-container { padding: 24px; display: flex; flex-direction: column; min-height: 100vh; }

        .header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--bg-header); cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.2s;
            text-decoration: none; color: var(--text-primary); flex-shrink: 0;
        }
        .back-btn:hover { background: var(--border-color); }
        .header-content { flex: 1; min-width: 0; }
        .header-title { font-family: 'Google Sans', sans-serif; font-size: 20px; font-weight: 500; }
        .header-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        .summary {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .summary-stat {
            flex: 1; background: var(--bg-header); border-radius: 10px;
            padding: 14px; text-align: center;
        }
        .summary-value { font-family: 'Google Sans', sans-serif; font-size: 26px; font-weight: 600; }
        .summary-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        .award-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .award-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .award-card-emoji { font-size: 24px; }
        .award-card-title { font-family: 'Google Sans', sans-serif; font-size: 16px; font-weight: 600; }
        .award-card-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }

        .winner {
            display: flex; align-items: center; gap: 8px;
            background: #fffbeb; border: 1px solid #fde68a;
            border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
        }
        .winner-name { font-family: 'Google Sans', sans-serif; font-weight: 600; font-size: 16px; }
        .winner-votes { margin-left: auto; font-size: 13px; color: var(--text-secondary); }
        .winner-tie { font-size: 11px; color: var(--gold); font-weight: 600; }

        .bar-row { margin-bottom: 8px; }
        .bar-row:last-child { margin-bottom: 0; }
        .bar-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
        .bar-name { color: var(--text-primary); }
        .bar-count { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .bar-track { height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--accent-blue); border-radius: 4px; }
        .bar-fill.top { background: var(--gold); }

        .no-votes { font-size: 13px; color: var(--text-secondary); font-style: italic; }

        .voters-card {
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 16px; margin-top: 8px;
        }
        .voters-title { font-family: 'Google Sans', sans-serif; font-size: 14px; font-weight: 500; margin-bottom: 10px; }
        .voters-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .voter-pill {
            background: var(--bg-header); border-radius: 14px;
            padding: 4px 12px; font-size: 13px; color: var(--text-primary);
        }

        /* Détail par votant (bulletins individuels) */
        .voter-detail { border-top: 1px solid var(--border-color); }
        .voter-detail:first-child { border-top: none; }
        .voter-detail-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 4px; cursor: pointer;
        }
        .voter-detail-head:hover { background: var(--bg-header); }
        .voter-detail-name { font-family: 'Google Sans', sans-serif; font-weight: 500; font-size: 14px; }
        .voter-detail-expand { color: var(--text-secondary); font-size: 13px; transition: transform 0.2s; }
        .voter-detail.open .voter-detail-expand { transform: rotate(180deg); }
        .voter-detail-ballot { padding: 2px 4px 10px; }
        .ballot-row {
            display: flex; justify-content: space-between; gap: 12px;
            padding: 5px 0; font-size: 13px; border-bottom: 1px dashed #ececec;
        }
        .ballot-row:last-child { border-bottom: none; }
        .ballot-award { color: var(--text-secondary); }
        .ballot-pick { font-weight: 500; color: var(--text-primary); white-space: nowrap; }

        .state { text-align: center; padding: 48px 24px; color: var(--text-secondary); font-size: 14px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <a href="index.html" class="back-btn">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </a>
            <div class="header-content">
                <h1 class="header-title">Résultats des votes</h1>
                <p class="header-subtitle">Awards de fin d'année</p>
            </div>
        </header>

        <main id="resultsRoot">
            <div class="state">Chargement des votes…</div>
        </main>
    </div>

    <!-- Firebase SDK (compat CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" integrity="sha384-4gq9w/AGf72FXdNQ3Kn3EqWP7633NbCMjpYHt8YCZyXf23o2opcuAr4cif41tLrC" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" integrity="sha384-Qgqc/HETq5lqJnRDqWnV1AZGw3pgMYNUVaqLLN1W/55XuWK94epwbCQrOvdoh1Zo" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" integrity="sha384-xtdq4MQqPj1dB5DQsuw9O7dh4kHhMP/Wp5u8O1jiaWiou13ZfJIgiccjtVK2pBhL" crossorigin="anonymous"></script>
    <script src="firebase-config.js"></script>
    <script src="admin-config.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="vote-config.js"></script>
    <script>
    (function() {
        'use strict';

        const root = document.getElementById('resultsRoot');
        function escapeHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function tally(votes, awardId) {
            // votes: array de { voter, votes:{awardId:prenom} } → { prenom: count }
            const counts = {};
            votes.forEach(v => {
                const pick = v.votes && v.votes[awardId];
                if (pick) counts[pick] = (counts[pick] || 0) + 1;
            });
            return Object.entries(counts)
                .map(([name, count]) => ({ name, count }))
                .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
        }

        function renderAward(award, ranked) {
            ranked = ranked || [];
            const totalForAward = ranked.reduce((s, r) => s + r.count, 0);
            const max = ranked.length ? ranked[0].count : 0;
            const winners = ranked.filter(r => r.count === max && max > 0);
            const tie = winners.length > 1;

            let winnerHtml = '<div class="no-votes">Aucun vote pour cet award.</div>';
            if (max > 0) {
                winnerHtml = `<div class="winner">
                    <span style="font-size:20px">${award.emoji}</span>
                    <span class="winner-name">${winners.map(w => escapeHtml(w.name)).join(', ')}</span>
                    ${tie ? '<span class="winner-tie">EX ÆQUO</span>' : ''}
                    <span class="winner-votes">${max} voix</span>
                </div>`;
            }

            const bars = ranked.map((r, i) => {
                const pct = totalForAward ? Math.round((r.count / max) * 100) : 0;
                return `<div class="bar-row">
                    <div class="bar-head">
                        <span class="bar-name">${escapeHtml(r.name)}</span>
                        <span class="bar-count">${r.count}</span>
                    </div>
                    <div class="bar-track"><div class="bar-fill ${r.count === max ? 'top' : ''}" style="width:${pct}%"></div></div>
                </div>`;
            }).join('');

            return `<div class="award-card">
                <div class="award-card-head">
                    <span class="award-card-emoji">${award.emoji}</span>
                    <span class="award-card-title">${escapeHtml(award.title)}</span>
                </div>
                <div class="award-card-desc">${escapeHtml(award.desc)}</div>
                ${winnerHtml}
                ${bars}
            </div>`;
        }

        function showState(msg) {
            const div = document.createElement('div');
            div.className = 'state';
            div.textContent = msg;
            root.innerHTML = '';
            root.appendChild(div);
        }

        // Rendu commun (admin et public) à partir du résumé agrégé : compteurs uniquement,
        // jamais les bulletins individuels.
        function renderAggregate(agg) {
            const voters = agg.voters || 0;
            const awards = agg.awards || {};
            root.innerHTML = `
                <div class="summary">
                    <div class="summary-stat">
                        <div class="summary-value">${voters}</div>
                        <div class="summary-label">Votant${voters > 1 ? 's' : ''}</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-value">${AWARDS.length}</div>
                        <div class="summary-label">Awards</div>
                    </div>
                </div>
                ${AWARDS.map(a => renderAward(a, awards[a.id])).join('')}`;
        }

        function buildAggregate(votes) {
            const awards = {};
            AWARDS.forEach(a => { awards[a.id] = tally(votes, a.id); });
            return { generatedAt: Date.now(), voters: votes.length, awards };
        }

        // Admin : lit les bulletins bruts, affiche, puis publie le résumé agrégé
        // dans config/voteResults (lecture publique) pour que toute l'équipe voie les compteurs.
        async function loadAdmin() {
            const snap = await db.collection('votes').get();
            // On ignore les documents de test (id préfixé "verif-")
            const votes = snap.docs.filter(d => !d.id.startsWith('verif-')).map(d => d.data());
            if (!votes.length) { showState('Aucun vote enregistré pour le moment.'); return; }
            const agg = buildAggregate(votes);
            renderAggregate(agg);
            try { await db.collection('config').doc('voteResults').set(agg); }
            catch (e) { console.warn('Publication du résumé impossible :', e.message); }
        }

        // Public (non-admin) : lit uniquement le résumé agrégé. Les bulletins
        // individuels (qui a voté pour qui) ne sont jamais accessibles.
        async function loadPublic() {
            try {
                const doc = await db.collection('config').doc('voteResults').get();
                if (!doc.exists) { showState('Les résultats ne sont pas encore publiés. Reviens bientôt !'); return; }
                renderAggregate(doc.data());
            } catch (e) { showState('Erreur de chargement : ' + e.message); }
        }

        if (typeof db === 'undefined' || typeof auth === 'undefined') {
            showState('Firebase non disponible.');
            return;
        }

        auth.onAuthStateChanged(user => {
            const isAdmin = user && typeof FirebaseSync !== 'undefined' && FirebaseSync.isAdmin();
            if (isAdmin) loadAdmin().catch(e => showState('Erreur de chargement : ' + e.message));
            else loadPublic();
        });
    })();
    </script>
</body>
</html>
